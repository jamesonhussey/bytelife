<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitLife 3D</title>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.82);
      --panel-2: rgba(30, 41, 59, 0.9);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #4ade80;
      --bad: #f87171;
      --warn: #fbbf24;
      --happy: #f472b6;
      --health: #4ade80;
      --smarts: #60a5fa;
      --looks: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1230; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); }
    canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    button { font: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }

    #identity { position: absolute; top: 16px; left: 16px; padding: 12px 16px; min-width: 240px; }
    #identity .name { font-size: 20px; font-weight: 700; }
    #identity .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    #identity .money { margin-top: 8px; font-size: 18px; font-weight: 700; color: var(--good); }
    #identity .edu { color: var(--muted); font-size: 12px; margin-top: 4px; }

    #stats { position: absolute; top: 16px; right: 16px; width: 260px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .stat { display: grid; grid-template-columns: 76px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; }
    .stat .bar { height: 10px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    .stat .fill { height: 100%; width: 50%; border-radius: 999px; transition: width 0.5s ease; }
    .stat .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .stat[data-k="happiness"] .fill { background: var(--happy); }
    .stat[data-k="health"] .fill { background: var(--health); }
    .stat[data-k="smarts"] .fill { background: var(--smarts); }
    .stat[data-k="looks"] .fill { background: var(--looks); }

    #log { position: absolute; right: 16px; top: 180px; bottom: 100px; width: 300px; padding: 10px 0; display: flex; flex-direction: column; }
    #log h3 { margin: 0 14px 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    #log .entries { flex: 1; overflow-y: auto; padding: 0 14px; font-size: 13px; line-height: 1.45; scrollbar-width: thin; }
    #log .entry { padding: 5px 0; border-bottom: 1px solid var(--line); }
    #log .entry.good { color: #bbf7d0; }
    #log .entry.bad { color: #fecaca; }
    #log .entry.age { color: var(--accent); font-weight: 700; border-bottom: none; padding-top: 10px; }

    #prompt { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); padding: 10px 18px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    #prompt kbd { background: rgba(255,255,255,0.12); border-radius: 6px; padding: 2px 8px; font-weight: 700; font-family: inherit; }
    #prompt button { background: var(--accent); color: #0b1230; border: none; border-radius: 8px; padding: 6px 12px; font-weight: 700; }

    #controls { position: absolute; left: 16px; bottom: 16px; padding: 10px 14px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    #controls kbd { background: rgba(255,255,255,0.12); border-radius: 4px; padding: 0 6px; color: var(--text); font-family: inherit; }

    #ageup { position: absolute; right: 16px; bottom: 16px; width: 300px; padding: 14px 18px; font-size: 18px; font-weight: 800; border: none; border-radius: 14px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 10px 30px rgba(34,197,94,0.35); letter-spacing: 0.02em; transition: transform 0.1s; }
    #ageup:hover { transform: translateY(-1px); }
    #ageup:disabled { opacity: 0.5; cursor: default; transform: none; }

    #toast { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); padding: 10px 16px; font-size: 14px; max-width: 520px; text-align: center; opacity: 0; transition: opacity 0.25s; }
    #toast.show { opacity: 1; }
    #toast.good { border-color: rgba(74,222,128,0.4); }
    #toast.bad { border-color: rgba(248,113,113,0.4); }

    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2, 6, 23, 0.55); backdrop-filter: blur(3px); z-index: 10; padding: 16px; }
    .dialog { width: min(520px, 100%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: pop 0.22s ease-out; }
    @keyframes pop { from { transform: scale(0.94) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .dialog h2 { margin: 0 0 8px; font-size: 22px; }
    .dialog p { margin: 0 0 16px; color: #cbd5e1; line-height: 1.5; font-size: 15px; }
    .dialog .choices { display: flex; flex-direction: column; gap: 8px; }
    .dialog .choices button, .dialog .menu-btn { text-align: left; background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 11px 14px; font-size: 15px; transition: background 0.12s, transform 0.08s; }
    .dialog .choices button:hover, .dialog .menu-btn:hover { background: rgba(56,189,248,0.18); border-color: rgba(56,189,248,0.4); }
    .dialog .choices button:disabled, .dialog .menu-btn:disabled { opacity: 0.45; cursor: default; }
    .dialog .menu-btn small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .dialog .row { display: flex; gap: 8px; align-items: center; }
    .dialog .close { margin-top: 14px; width: 100%; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 9px; }
    .dialog .close:hover { color: var(--text); }
    .dialog .result { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; min-height: 20px; }
    .dialog .result.good { background: rgba(74,222,128,0.12); }
    .dialog .result.bad { background: rgba(248,113,113,0.12); }
    .dialog .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--muted); margin-left: 6px; vertical-align: middle; }

    .family { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .family .member { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; background: rgba(255,255,255,0.04); border-radius: 10px; font-size: 14px; }
    .family .member .meta { color: var(--muted); font-size: 12px; }
    .family .member button { background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.3); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    .rel { height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .rel i { display: block; height: 100%; background: var(--happy); }

    .form label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    .form input, .form select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--text); font: inherit; }
    .form .primary { margin-top: 18px; width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #04111f; font-weight: 800; font-size: 16px; }
    .form .secondary { margin-top: 8px; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--muted); }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--text); }
    .seg button.active { background: rgba(56,189,248,0.2); border-color: var(--accent); }

    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .summary div { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
    .summary b { display: block; color: var(--text); font-size: 18px; margin-top: 2px; }
    .title-big { font-size: 42px; font-weight: 900; letter-spacing: -0.02em; margin: 0 0 4px; background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }

    #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 rgba(120, 0, 0, 0); transition: box-shadow 1.2s ease; z-index: 5; }
    #vignette.dead { box-shadow: inset 0 0 220px 80px rgba(90, 0, 0, 0.75); }

    @media (max-width: 900px) {
      #log { display: none; }
      #stats { width: 200px; }
      #ageup { width: 200px; font-size: 15px; }
      #controls { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="hud">
    <div id="identity" class="card">
      <div class="name">—</div>
      <div class="sub">—</div>
      <div class="money">$0</div>
      <div class="edu"></div>
    </div>
    <div id="stats" class="card">
      <div class="stat" data-k="happiness"><span>Happiness</span><div class="bar"><div class="fill"></div></div><span class="val">0</span></div>
      <div class="stat" data-k="health"><span>Health</span><div class="bar"><div class="fill"></div></div><span class="val">0</span></div>
      <div class="stat" data-k="smarts"><span>Smarts</span><div class="bar"><div class="fill"></div></div><span class="val">0</span></div>
      <div class="stat" data-k="looks"><span>Looks</span><div class="bar"><div class="fill"></div></div><span class="val">0</span></div>
    </div>
    <div id="log" class="card">
      <h3>Life</h3>
      <div class="entries"></div>
    </div>
    <div id="prompt" class="card hidden"><span class="text"></span><kbd>E</kbd><button>Enter</button></div>
    <div id="controls" class="card">
      <kbd>WASD</kbd> move · <kbd>Click</kbd> walk there · <kbd>Drag</kbd> / <kbd>Q</kbd><kbd>C</kbd> rotate · <kbd>Scroll</kbd> zoom · <kbd>E</kbd> enter building
    </div>
    <button id="ageup">Age Up ▸</button>
    <div id="toast" class="card"></div>
  </div>
  <div id="modal" class="overlay hidden"></div>
  <div id="menu" class="overlay hidden"></div>
  <div id="screen" class="overlay hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
